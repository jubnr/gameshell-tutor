# Netlify configuration for the gameshell-tutor browser demo.
#
# MUST live at the repository root: Netlify only reads netlify.toml from the
# root (or from a configured base directory), so keeping it inside demo/ would
# silently publish the repo root instead of the demo.
#
# The site is a single self-contained HTML file, generated by demo/build.py and
# committed, so there is nothing to build here.

[build]
  publish = "demo"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    # the page loads no script, style, font or image from any other host
    Content-Security-Policy = "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"
