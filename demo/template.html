<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>gameshell-tutor : demo</title>
<meta name="description" content="Play the first three GameShell missions in your browser, with the Game Master tutor.">
<style>
  :root{
    --bg:#12101a; --bg2:#1a1726; --fg:#d9d6e3; --dim:#7d7791;
    --gm:#d98fe0; --ok:#7fd88f; --err:#f2857f; --acc:#8ab4f8;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);
       font-size:14px;line-height:1.55;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;
         padding:.6rem .9rem;background:var(--bg2);border-bottom:1px solid #2b2740}
  header h1{margin:0;font-size:.95rem;font-weight:600;letter-spacing:.02em}
  header .sub{color:var(--dim);font-size:.8rem}
  header .spacer{flex:1}
  .pill{border:1px solid #3a3456;background:transparent;color:var(--fg);
        font-family:inherit;font-size:.78rem;padding:.2rem .55rem;border-radius:99px;
        cursor:pointer}
  .pill[aria-pressed="true"]{background:#3a3456;border-color:#524a7a}
  .pill:hover{border-color:#6d64a0}
  a{color:var(--acc)}
  #wrap{flex:1;overflow-y:auto;padding:1rem .9rem 0}
  #term{max-width:82ch;margin:0 auto;white-space:pre-wrap;word-break:break-word}
  .l{display:block}
  .gm{color:var(--gm)}
  .gmhead{color:var(--gm);font-weight:700}
  .err{color:var(--err)}
  .ok{color:var(--ok)}
  .dim{color:var(--dim)}
  .cmd{color:var(--fg)}
  .cmd .p{color:var(--ok)}
  #form{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 28%);
        padding:.5rem 0 1rem}
  #row{max-width:82ch;margin:0 auto;display:flex;gap:.5ch;align-items:baseline}
  #ps1{color:var(--ok);white-space:pre}
  #in{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--fg);
      font:inherit;padding:0}
  #done{max-width:82ch;margin:1rem auto;padding:.9rem 1rem;border:1px solid #3a3456;
        border-radius:8px;background:var(--bg2)}
  #done h2{margin:.1rem 0 .5rem;font-size:1rem;color:var(--gm)}
  #done p{margin:.35rem 0}
  footer{max-width:82ch;margin:0 auto;padding:0 .9rem 1rem;color:var(--dim);
         font-size:.76rem}
  @media (max-width:640px){body{font-size:13px}#wrap{padding:.7rem .6rem 0}}
</style>
</head>
<body>
<header>
  <h1>🧙 gameshell-tutor</h1>
  <span class="sub" id="tag"></span>
  <span class="spacer"></span>
  <button class="pill" id="fr" aria-pressed="true">FR</button>
  <button class="pill" id="en" aria-pressed="false">EN</button>
  <button class="pill" id="rst"></button>
</header>

<div id="wrap"><div id="term"></div>
  <div id="form"><div id="row">
    <span id="ps1"></span><input id="in" autocomplete="off" autocapitalize="off"
      autocorrect="off" spellcheck="false" aria-label="terminal input">
  </div></div>
  <footer id="foot"></footer>
</div>

<script>
const DATA = /*__GAME_DATA__*/null;

/* ---------- UI strings (the demo shell itself, not the tutor) ---------- */
const UI = {
  fr:{tag:"3 premieres missions, dans le navigateur",
      reset:"recommencer",
      boot:"GameShell (demo). Tapez `ls`, `cd LIEU`, `pwd`. Parlez au Maitre du Jeu avec `gm`.",
      nofile:(c,a)=>`bash: ${c}: ${a}: Aucun fichier ou dossier de ce type`,
      notdir:(a)=>`bash: cd: ${a}: N'est pas un dossier`,
      nocmd:(a)=>`bash: ${a}: commande introuvable`,
      noprev:"bash: cd: OLDPWD non defini",
      help:["gm                  me parler librement (ou : gm <question>)",
            "gm indice           un indice, jamais la reponse d'abord",
            "gm mission          reentendre l'epreuve en cours",
            "gm reset            recommencer l'epreuve",
            "gm commandes        cette liste"],
      done:["Demo terminee !","Vous avez fini les 3 premieres epreuves. Le jeu complet en compte 45,",
            "avec les tubes, les permissions, les processus, le labyrinthe..."],
      full:"Le projet complet",
      note:"Demo hors-ligne : le Maitre du Jeu utilise ici ses reponses deterministes. Dans le vrai jeu il peut aussi tourner sur un LLM local (Ollama).",
      skip:"(cliquez pour tout afficher)"},
  en:{tag:"first 3 missions, in your browser",
      reset:"restart",
      boot:"GameShell (demo). Try `ls`, `cd LOCATION`, `pwd`. Talk to the Game Master with `gm`.",
      nofile:(c,a)=>`bash: ${c}: ${a}: No such file or directory`,
      notdir:(a)=>`bash: cd: ${a}: Not a directory`,
      nocmd:(a)=>`bash: ${a}: command not found`,
      noprev:"bash: cd: OLDPWD not set",
      help:["gm                  talk to me freely (or: gm <question>)",
            "gm hint             a hint, never the answer first",
            "gm goal             hear the current trial again",
            "gm reset            restart the trial",
            "gm commands         this list"],
      done:["Demo complete!","You finished the first 3 trials. The full game has 45,",
            "covering pipes, permissions, processes, the maze and more."],
      full:"The full project",
      note:"Offline demo: the Game Master is using its deterministic replies here. In the real game it can also run on a local LLM (Ollama).",
      skip:"(click to show everything)"}
};
const REPO = "/*__REPO_URL__*/";   /* set by build.py from $DEMO_REPO_URL */

/* ---------- state ---------- */
let lang="fr", mi=0, cwd=[], prev=null, missionCmds=[], fails=0, level=1,
    finished=false, hist=[], hpos=0, queue=[], timer=null;

const term=document.getElementById("term"), input=document.getElementById("in"),
      ps1=document.getElementById("ps1"), wrap=document.getElementById("wrap");

const M = ()=>DATA.missions[mi];
const T = ()=>DATA.t[lang];
const U = ()=>UI[lang];

/* ---------- world ---------- */
function nodeAt(path){
  let lvl=DATA.world, node=null;
  for(const key of path){ node=lvl[key]; if(!node) return null; lvl=node.children; }
  return path.length? node : {children:DATA.world};
}
function childrenAt(path){ const n=nodeAt(path); return n? (n.children||{}) : {}; }
function disp(key,node){ return lang==="fr" ? (node.fr||key) : key; }
function dispPath(path){
  let out=[], lvl=DATA.world;
  for(const key of path){ const n=lvl[key]; if(!n) break; out.push(disp(key,n)); lvl=n.children; }
  return out;
}
function pwdStr(path){ const d=dispPath(path); return d.length? "~/"+d.join("/") : "~"; }

/* resolve an argument to a path array, or {err} */
function resolve(arg){
  if(arg==="-"){ if(prev===null) return {err:U().noprev}; return {path:prev.slice(),show:true}; }
  let path, rest;
  if(arg===""||arg===undefined||arg==="~"){ return {path:[]}; }
  if(arg==="~/"||arg.startsWith("~/")){ path=[]; rest=arg.slice(2); }
  else if(arg.startsWith("/")){ path=[]; rest=arg.slice(1); }
  else { path=cwd.slice(); rest=arg; }
  for(const seg of rest.split("/")){
    if(seg===""||seg===".") continue;
    if(seg===".."){ path.pop(); continue; }
    const kids=childrenAt(path);
    const key=Object.keys(kids).find(k=>disp(k,kids[k])===seg);
    if(!key) return {err:null, missing:seg};
    path.push(key);
  }
  return {path};
}

/* ---------- output ---------- */
function line(text,cls){
  const el=document.createElement("span");
  el.className="l "+(cls||""); el.textContent=text===""?" ":text;
  term.appendChild(el); return el;
}
function scroll(){ wrap.scrollTop=wrap.scrollHeight; }

/* the Game Master speaks line by line; click anywhere to flush */
function say(text,head){
  const lines=String(text).replace(/\x06/g,"").split("\n");
  if(head!==false) queue.push({t:head||("🧙 "+(lang==="fr"?"Le Maitre du Jeu":"The Game Master")),c:"gmhead"});
  for(const l of lines) queue.push({t:l?"   "+l:"",c:"gm"});
  queue.push({t:"",c:""});
  pump();
}
function pump(){
  if(timer!==null) return;          // an id of 0 is legal, so test for null
  timer=setInterval(()=>{
    const it=queue.shift();
    if(!it){ clearInterval(timer); timer=null; input.focus(); return; }
    line(it.t,it.c); scroll();
  },28);
}
function flush(){                    // always drains, timer running or not
  if(timer!==null){ clearInterval(timer); timer=null; }
  let it; while((it=queue.shift())) line(it.t,it.c);
  scroll(); input.focus();
}
document.addEventListener("click",e=>{ if(e.target.tagName!=="BUTTON") flush(); });

/* ---------- tutor ---------- */
function fill(tpl,vars){
  return String(tpl).replace(/\{(\w+)\}/g,(m,k)=> (k in vars)? vars[k] : m);
}
function hintsFor(){ const h=M().hints; return h[lang]||h.en||[]; }

function briefing(){
  const m=M();
  const parts=[T().brief_intro,"",m.goal[lang],"",(m.intent[lang]||""),"",T().brief_outro];
  say(DATA.art+"\n\n"+parts.join("\n"));
}
function unlock(){
  fails++;
  if(fails>=6) level=4; else if(fails>=4) level=3; else if(fails>=2) level=2;
}
function askHint(){
  const h=hintsFor(); if(!h.length) return say(T().chat_redirect);
  say(h[Math.min(Math.max(level-2,0),h.length-1)]);
}
function chat(msg){
  const q=msg.toLowerCase();
  if(/what does|que fait|qu'est-ce que|c'est quoi|affiche|output/.test(q)) return say(T().run_and_see);
  const h=hintsFor();
  if(level>=2 && h.length>=level-1) return say(h[level-2]);
  say(T().chat_redirect);
}

/* ---------- mission check (the engine's real predicates) ---------- */
function passes(){
  const m=M();
  if(dispPath(cwd).join("/")!==dispPath(m.target).join("/")) return false;
  if(m.rule==="pwd+history"){
    const c=missionCmds.filter(x=>x.trim()!=="");
    if(c.length<2) return false;
    const prevCmd=c[c.length-2].trim();
    if(!/^cd(\s+~)?$/.test(prevCmd)) return false;
    if(!/^cd\s+\S/.test(c[c.length-1].trim())) return false;
  }
  return true;
}
function afterCommand(){
  if(finished||!passes()) return;
  const m=M();
  let idiom="";
  const rev=m.idiom&&m.idiom[lang];
  if(rev && (!m.idiom_trigger || missionCmds.join(" ; ").includes(m.idiom_trigger))) idiom=rev;
  say(fill(T().check_pass,{idiom}).trim());
  if(mi+1>=DATA.missions.length){ finished=true; setTimeout(endPanel,300); return; }
  mi++; level=1; fails=0; missionCmds=[];
  cwd=M().start.slice(); prev=null;
  setTimeout(()=>{ briefing(); setPs1(); },200);
}

/* ---------- commands ---------- */
function runGm(args){
  const sub=(args[0]||"").toLowerCase();
  if(!args.length) return say(T().chat_redirect);
  if(["indice","hint"].includes(sub)) return askHint();
  if(["mission","goal","epreuve","but"].includes(sub)) return briefing();
  if(["commandes","commands","aide"].includes(sub)) return say(U().help.join("\n"));
  if(["fini","valide","check"].includes(sub)){
    // the briefing renames the engine's `gsh check` to this, so it has to
    // work: checks are automatic in the demo, this just reports the verdict
    if(passes()) return afterCommand();
    const why=lang==="fr"?"Tu n'y es pas encore.":"Not there yet.";
    return say(fill(T().check_fail,{output:why}));
  }
  if(sub==="reset"){ cwd=M().start.slice(); prev=null; missionCmds=[]; setPs1();
                     return briefing(); }
  chat(args.join(" "));
}
function run(raw){
  const cmdline=raw.trim();
  if(cmdline==="") return;
  const parts=cmdline.split(/\s+/), c=parts[0], args=parts.slice(1);
  if(c==="clear"){ term.innerHTML=""; return; }
  if(c==="gm"||c==="maitre"){ runGm(args); return; }

  missionCmds.push(cmdline);
  if(c==="pwd"){ line(pwdStr(cwd)); return afterCommand(); }
  if(c==="ls"){
    const kids=childrenAt(cwd);
    const names=Object.keys(kids).map(k=>disp(k,kids[k])).sort();
    if(names.length) line(names.join("  "));
    return afterCommand();
  }
  if(c==="cd"){
    const r=resolve(args[0]===undefined?"":args[0]);
    if(r.err){ line(r.err,"err"); return; }
    if(r.missing){
      const msg=U().nofile("cd",args[0]);
      line(msg,"err"); unlock();
      say(fill(T().err_no_such_file,{errline:msg,cwd:pwdStr(cwd)}));
      return;
    }
    prev=cwd.slice(); cwd=r.path;
    if(r.show) line(pwdStr(cwd));
    setPs1();
    return afterCommand();
  }
  const msg=U().nocmd(c);
  line(msg,"err"); unlock();
  say(fill(T().err_not_found,{errline:msg,cwd:pwdStr(cwd)}));
}

/* ---------- chrome ---------- */
function setPs1(){ ps1.textContent=`[${lang==="fr"?"epreuve":"mission"} ${mi+1}] $`; }
function endPanel(){
  const d=document.createElement("div"); d.id="done";
  const u=U();
  d.innerHTML=`<h2>${u.done[0]}</h2>`+u.done.slice(1).map(p=>`<p>${p}</p>`).join("")+
    (REPO?`<p><a href="${REPO}" target="_blank" rel="noopener">${u.full} \u2192</a></p>`:"");
  term.appendChild(d); scroll();
}
function boot(reset){
  term.innerHTML=""; queue=[]; if(timer){clearInterval(timer);timer=null;}
  mi=0; level=1; fails=0; missionCmds=[]; finished=false; prev=null;
  cwd=M().start.slice();
  document.getElementById("tag").textContent=U().tag;
  document.getElementById("rst").textContent=U().reset;
  document.getElementById("foot").textContent=U().note;
  setPs1();
  line(U().boot,"dim"); line("");
  briefing();
}
for(const l of ["fr","en"]) document.getElementById(l).onclick=()=>{
  lang=l;
  document.getElementById("fr").setAttribute("aria-pressed",l==="fr");
  document.getElementById("en").setAttribute("aria-pressed",l==="en");
  document.documentElement.lang=l;
  boot();
};
document.getElementById("rst").onclick=()=>boot();

input.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    const v=input.value; input.value="";
    flush();
    const el=line("","cmd");
    const p=document.createElement("span"); p.className="p"; p.textContent=ps1.textContent+" ";
    el.appendChild(p); el.appendChild(document.createTextNode(v));
    if(v.trim()){ hist.push(v); hpos=hist.length; }
    run(v); scroll();
  } else if(e.key==="ArrowUp"){
    if(hpos>0){ hpos--; input.value=hist[hpos]||""; }
    e.preventDefault();
  } else if(e.key==="ArrowDown"){
    if(hpos<hist.length){ hpos++; input.value=hist[hpos]||""; }
    e.preventDefault();
  } else if(e.key==="Tab"){
    e.preventDefault();
    const parts=input.value.split(/\s+/), last=parts[parts.length-1]||"";
    const seg=last.split("/"); const stem=seg.pop();
    const base=seg.length? resolve(seg.join("/")) : {path:cwd.slice()};
    if(base.missing||base.err) return;
    const kids=childrenAt(base.path);
    const hits=Object.keys(kids).map(k=>disp(k,kids[k])).filter(n=>n.startsWith(stem));
    if(hits.length===1){
      seg.push(hits[0]); parts[parts.length-1]=seg.join("/")+"/";
      input.value=parts.join(" ");
    } else if(hits.length>1){ flush(); line(hits.join("  "),"dim"); scroll(); }
  }
});
boot();
</script>
</body>
</html>
