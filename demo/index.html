<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>gameshell-tutor : demo</title>
<meta name="description" content="Play the first three GameShell missions in your browser, with the Game Master tutor.">
<style>
  :root{
    --bg:#12101a; --bg2:#1a1726; --fg:#d9d6e3; --dim:#7d7791;
    --gm:#d98fe0; --ok:#7fd88f; --err:#f2857f; --acc:#8ab4f8;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--mono);
       font-size:14px;line-height:1.55;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;
         padding:.6rem .9rem;background:var(--bg2);border-bottom:1px solid #2b2740}
  header h1{margin:0;font-size:.95rem;font-weight:600;letter-spacing:.02em}
  header .sub{color:var(--dim);font-size:.8rem}
  header .spacer{flex:1}
  .pill{border:1px solid #3a3456;background:transparent;color:var(--fg);
        font-family:inherit;font-size:.78rem;padding:.2rem .55rem;border-radius:99px;
        cursor:pointer}
  .pill[aria-pressed="true"]{background:#3a3456;border-color:#524a7a}
  .pill:hover{border-color:#6d64a0}
  a{color:var(--acc)}
  #wrap{flex:1;overflow-y:auto;padding:1rem .9rem 0}
  #term{max-width:82ch;margin:0 auto;white-space:pre-wrap;word-break:break-word}
  .l{display:block}
  .gm{color:var(--gm)}
  .gmhead{color:var(--gm);font-weight:700}
  .err{color:var(--err)}
  .ok{color:var(--ok)}
  .dim{color:var(--dim)}
  .cmd{color:var(--fg)}
  .cmd .p{color:var(--ok)}
  #form{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 28%);
        padding:.5rem 0 1rem}
  #row{max-width:82ch;margin:0 auto;display:flex;gap:.5ch;align-items:baseline}
  #ps1{color:var(--ok);white-space:pre}
  #in{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--fg);
      font:inherit;padding:0}
  #done{max-width:82ch;margin:1rem auto;padding:.9rem 1rem;border:1px solid #3a3456;
        border-radius:8px;background:var(--bg2)}
  #done h2{margin:.1rem 0 .5rem;font-size:1rem;color:var(--gm)}
  #done p{margin:.35rem 0}
  footer{max-width:82ch;margin:0 auto;padding:0 .9rem 1rem;color:var(--dim);
         font-size:.76rem}
  @media (max-width:640px){body{font-size:13px}#wrap{padding:.7rem .6rem 0}}
</style>
</head>

<script>
const DATA = {"missions":[{"id":"basic/01_cd_tower","target":["Castle","Main_tower","First_floor","Second_floor","Top_of_the_tower"],"start":[],"rule":"pwd","goal":{"fr":"Allez tout en haut du donjon.\n\n\nCommandes utiles\n================\n\ncd LIEU\n  Se déplace vers le lieu donné.\n  Note : ``cd`` est une abréviation pour \"change directory\".\n\nls\n  Liste les lieux accessibles depuis la position actuelle.\n  Note : ``ls`` est une abréviation pour \"liste\".\n\npwd\n  Affiche la position actuelle.\n  Note : ``pwd`` est une abréviation pour \"print working directory\".\n\ngm fini\n  Vérifie si l'objectif de la mission a été atteint.\n\ngm reset\n  Ré-initialise la mission au début.\n\n\nRemarque\n--------\n\nLes termes apparaissant en MAJUSCULES dans les commandes sont des \nméta-variables : vous devez les remplacer par des valeurs (chaines \nde caractères) appropriées.\n\nLa plupart des systèmes de fichiers différencient les caractères \nmajuscules et minuscules. Faites attention à utiliser le bon chemin.","en":"Go to the top of the main tower of the castle.\n\n\nUseful commands\n===============\n\ncd LOCATION\n  Move to the given location.\n  Remark: ``cd`` is an abbreviation for \"change directory\".\n\npwd\n  Show the path to your current location.\n  Remark: ``pwd`` is an abbreviation for \"print working directory\".\n\nls\n  Show a list of locations that are currently accessible.\n  Remark: ``ls`` is an abbreviation of \"list\".\n\ngm fini\n  Check if the mission objective has been achieved.\n\ngm reset\n  Restart the mission from the beginning.\n\n\nRemarks\n-------\n\nUPPERCASE words appearing in commands are meta-variables: you need \nto replace them by appropriate (string) values.\n\nMost filesystems treat uppercase and lowercase characters \ndifferently. Make sure you use the correct path."},"intent":{"fr":"But : te trouver tout en haut du donjon (Chateau/Donjon/Premier_etage/Deuxieme_etage/Haut_du_donjon).","en":"Goal: be standing at the top of the tower (Castle/Main_tower/First_floor/Second_floor/Top_of_the_tower)."},"hints":{"fr":["Niveau concept : dans le shell, chaque lieu est un répertoire. `cd LIEU` t'y déplace, `ls` liste les lieux accessibles, `pwd` te dit où tu es. Comment découvrir les lieux accessibles depuis ta position actuelle ?","Piste concrète : depuis le point de départ, l'itinéraire est `Chateau`, puis `Donjon`, puis `Premier_etage`, `Deuxieme_etage` et enfin `Haut_du_donjon`. À chaque étape, `ls` te montre la suite (attention aux majuscules !).","La commande : depuis n'importe où : `cd ~/Chateau/Donjon/Premier_etage/Deuxieme_etage/Haut_du_donjon` — je validerai aussitôt."],"en":["Concept: in the shell, every location is a directory. `cd PLACE` moves you there, `ls` lists reachable places, `pwd` tells you where you are. How can you discover which places are reachable from your current position?","Concrete lead: from the start, the route is `Castle`, then `Main_tower`, `First_floor`, `Second_floor` and finally `Top_of_the_tower`. At each step `ls` shows what comes next (mind the capital letters!).","The command: from anywhere: `cd ~/Castle/Main_tower/First_floor/Second_floor/Top_of_the_tower` — I will validate right away."]},"idiom":{"fr":"Version pro : au lieu d'enchaîner cinq `cd`, un seul chemin fait tout : `cd Chateau/Donjon/Premier_etage/Deuxieme_etage/Haut_du_donjon`. Compromis : le chemin est long à taper, mais la touche Tab le complète morceau par morceau — et une seule commande suffit.","en":"Pro version: instead of chaining five `cd` commands, a single path does it all: `cd Castle/Main_tower/First_floor/Second_floor/Top_of_the_tower`. Tradeoff: the path is long to type, but the Tab key completes it piece by piece — and one command is enough."},"idiom_trigger":"cd Chateau"},{"id":"basic/02_cd.._cellar","target":["Castle","Cellar"],"start":["Castle","Main_tower","First_floor","Second_floor","Top_of_the_tower"],"rule":"pwd","goal":{"fr":"Allez dans la cave du château.\n\n\nObjectif secondaire\n-------------------\n\nApprenez à faire la différence entre ``cd -`` et ``cd ..``.\n\n\nCommandes utiles\n================\n\ncd -\n  Retourne dans le lieu précédent.\n\ncd ..\n  Se déplace dans le répertoire parent (le lieu qui se trouve \n  \"avant\" le lieu actuel dans la liste donnée par ``pwd``).\n\npwd\n  Affiche la position actuelle.","en":"Go the castle's cellar.\n\n\nSecondary objective\n-------------------\n\nUnderstand the difference between ``cd -`` and ``cd ..``.\n\n\nUseful commands\n===============\n\ncd -\n  Jump back to the location you were in prior to your last move.\n\ncd ..\n  Move to the parent directory (one step back along the path to your \n  current location).\n\npwd\n  See the path to your current location."},"intent":{"fr":"But : te trouver dans la cave du château (Chateau/Cave).","en":"Goal: be standing in the castle's cellar (Castle/Cellar)."},"hints":{"fr":["Niveau concept : `cd ..` remonte au répertoire PARENT (un cran en arrière dans le chemin de `pwd`), alors que `cd -` retourne au lieu PRÉCÉDENT de ton historique, où qu'il soit. Si tu viens de sauter directement en haut du donjon, ces deux commandes t'emmènent-elles au même endroit ?","Piste concrète : la Cave se trouve dans `~/Chateau`. Depuis le haut du donjon, redescends avec plusieurs `cd ..` jusqu'à `~/Chateau` (vérifie avec `pwd`), puis entre dans `Cave` — tu y trouveras un `tonneau_de_pommes`.","La commande : depuis n'importe où : `cd ~/Chateau/Cave` (ou remonte avec `cd ..` jusqu'à `~/Chateau` puis `cd Cave`) — je validerai aussitôt."],"en":["Concept: `cd ..` climbs to the PARENT directory (one step back along the `pwd` path), while `cd -` jumps back to the PREVIOUS location in your history, wherever that was. If you just teleported straight to the top of the tower, do these two commands take you to the same place?","Concrete lead: the Cellar lives inside `~/Castle`. From the top of the tower, climb down with several `cd ..` until you reach `~/Castle` (check with `pwd`), then enter `Cellar` — you will find a `barrel_of_apples` there.","The command: from anywhere: `cd ~/Castle/Cellar` (or climb with `cd ..` up to `~/Castle` then `cd Cellar`) — I will validate right away."]},"idiom":{"fr":"Version pro : `cd -` bascule instantanément entre tes deux derniers lieux — très pratique pour faire l'aller-retour. Compromis : `cd -` dépend de ton historique de déplacements, alors que `cd ..` est structurel : il remonte toujours d'un cran dans le chemin, quoi qu'il arrive.","en":"Pro version: `cd -` instantly toggles between your last two locations — very handy for going back and forth. Tradeoff: `cd -` depends on your movement history, while `cd ..` is structural: it always climbs one step up the path, no matter what."},"idiom_trigger":"cd .."},{"id":"basic/03_cd_HOME_throne","target":["Castle","Main_building","Throne_room"],"start":["Castle","Cellar"],"rule":"pwd+history","goal":{"fr":"Retournez au point de départ puis allez dans la salle du trône en \nutilisant seulement 2 commandes.\n\nRemarque\n--------\n\nVous pouvez faire tous les déplacements que vous souhaitez, mais \npour valider cette mission il faut que les conditions suivantes \nsoient satisfaites :\n  - l'avant-dernière commande vous ramène au point de départ,\n  - la dernière commande vous amène directement dans la salle du \n    trône.\n\n\nCommandes utiles\n================\n\ncd\n  Revient au lieu de départ de GameShell.\n\ncd LIEU1/LIEU2/LIEU3\n  Fait plusieurs déplacements avec une commande.\n\n\nRemarque\n--------\n\nLes termes apparaissant en MAJUSCULES dans les commandes sont des \nméta-variables : vous devez les remplacer par des valeurs (chaines \nde caractères) appropriées.","en":"Go back to the starting location and then go to the throne room \nusing only two commands.\n\nRemark\n------\n\nYou may experiment with as many commands as you want, but\nto validate the mission the following conditions need to be met:\n  - the second to last command takes you to the starting point,\n  - the last command takes you directly to the throne room.\n\n\nUseful commands\n===============\n\ncd\n  Move back to GameShell's starting location.\n\ncd LOCATION1/LOCATION2/LOCATION3\n  Make several moves in one command.\n\n\nRemark\n------\n\nUPPERCASE words appearing in commands are meta-variables: you need \nto replace them by appropriate (string) values."},"intent":{"fr":"But : revenir au point de départ avec `cd` seul, puis rejoindre la salle du trône en UNE seule commande.","en":"Goal: return to the starting point with a bare `cd`, then reach the throne room in ONE single command."},"hints":{"fr":["Niveau concept : `cd` sans aucun argument te ramène TOUJOURS au point de départ, d'où que tu sois. Et un chemin peut enchaîner plusieurs lieux séparés par des `/`. Comment atteindre la salle du trône avec un seul chemin depuis le départ ?","Piste concrète : tu as été téléporté·e dans `~/Chateau/Cave`. Le contrôle exige exactement : avant-dernière commande = `cd` tout seul (les `cd ..` en chaîne sont refusés !), dernière commande = un saut direct vers `Chateau/Batiment_principal/Salle_du_trone`.","La commande : tape `cd` (seul), puis `cd Chateau/Batiment_principal/Salle_du_trone` — je validerai aussitôt."],"en":["Concept: `cd` with no argument ALWAYS brings you back to the starting point, wherever you are. And a path can chain several places separated by `/`. How could you reach the throne room with a single path from the start?","Concrete lead: you have been teleported into `~/Castle/Cellar`. The check demands exactly: second-to-last command = a bare `cd` (chains of `cd ..` are rejected!), last command = a direct jump to `Castle/Main_building/Throne_room`.","The command: type `cd` (alone), then `cd Castle/Main_building/Throne_room` — I will validate right away."]},"idiom":{"fr":"Version pro : `cd` tout seul (ou `cd ~`) remplace n'importe quelle chaîne de `cd ..` pour rentrer à la maison, et `cd ~/Chateau/Batiment_principal/Salle_du_trone` marche depuis n'importe où grâce au `~`. Compromis : `cd` seul ne mène qu'au répertoire initial — pour toute autre destination, il faut donner le chemin.","en":"Pro version: a bare `cd` (or `cd ~`) replaces any chain of `cd ..` to get home, and `cd ~/Castle/Main_building/Throne_room` works from anywhere thanks to `~`. Tradeoff: a bare `cd` only leads to the home directory — for any other destination you must give the path."},"idiom_trigger":"cd .."}],"art":"       |>>>            |>>>\n    ___|________________|___\n   |_|_|_|_|_|_|_|_|_|_|_|_|\n   |   ___     ___     ___  |\n   |  |   |   | + |   |   | |\n   |__|___|___|___|___|___|_|","world":{"Castle":{"fr":"Chateau","children":{"Main_tower":{"fr":"Donjon","children":{"First_floor":{"fr":"Premier_etage","children":{"Second_floor":{"fr":"Deuxieme_etage","children":{"Top_of_the_tower":{"fr":"Haut_du_donjon","children":{}}}}}}}},"Main_building":{"fr":"Batiment_principal","children":{"Throne_room":{"fr":"Salle_du_trone","children":{"Kings_quarter":{"fr":"Chambre_du_roi","children":{}}}},"Library":{"fr":"Bibliotheque","children":{"Merlin_s_office":{"fr":"Bureau_de_Merlin","children":{}}}}}},"Cellar":{"fr":"Cave","children":{}},"Great_hall":{"fr":"Grande_salle","children":{}},"Observatory":{"fr":"Observatoire","children":{}}}},"Forest":{"fr":"Foret","children":{"Hut":{"fr":"Hutte","children":{"Chest":{"fr":"Coffre","children":{}}}}}},"Garden":{"fr":"Jardin","children":{"Maze":{"fr":"Labyrinthe","children":{}}}},"Mountain":{"fr":"Montagne","children":{"Cave":{"fr":"Grotte","children":{}}}},"Stall":{"fr":"Echoppe","children":{}}},"t":{"fr":{"brief_intro":"⚔ Approche, aventurier·ère — voici ta nouvelle épreuve :","brief_outro":"Des questions ? Tape `gm` (puis Entrée) et parle-moi librement. J'annoncerai moi-même ta victoire dès que l'épreuve sera accomplie.","err_no_such_file":"Le shell répond : « {errline} ». Il ne trouve pas ce chemin depuis `{cwd}`. Que te montre `ls` ici ? Le fichier est-il vraiment là, sous ce nom exact ?","err_not_found":"« {errline} » — le shell ne connaît pas cette commande. Vérifie l'orthographe. (Tape-la puis regarde ce que le shell répond, c'est lui qui a raison.)","err_generic":"La commande a échoué (code {exit}). Lis le message exact :\n  {errline}\nQue t'apprend-il sur la cause ?","check_fail":"L'épreuve n'est pas encore accomplie :\n  {output}\nCompare ce qui est attendu avec l'état réel — que te montre `ls` à l'endroit concerné ?","check_pass":"🎉 Épreuve accomplie, aventurier·ère ! {idiom}","idle":"Toujours là, aventurier·ère ? Si tu es bloqué·e, tape `gm` et dis-moi ce que tu essaies d'obtenir, ou demande `gm indice`.","run_and_see":"Je ne vais pas te le dire : lance la commande et observe la sortie réelle — c'est le shell qui fait foi. Reviens me dire ce que tu vois.","chat_redirect":"Bonne question. Avant que je réponde : que te dit le dernier message du shell ? Décris-le moi.","hint_capped":"Essaie encore un peu par toi-même, aventurier·ère — je monte d'un cran si tu bloques vraiment (ou après quelques essais)."},"en":{"brief_intro":"⚔ Come closer, adventurer — here is your new trial:","brief_outro":"Questions? Type `gm` (then Enter) and talk to me freely. I will proclaim your victory myself as soon as the trial is accomplished.","err_no_such_file":"The shell says: \"{errline}\". It cannot find that path from `{cwd}`. What does `ls` show here? Is the file really there, under that exact name?","err_not_found":"\"{errline}\" — the shell does not know that command. Check the spelling. (The shell's answer is the truth.)","err_generic":"The command failed (exit {exit}). Read the exact message:\n  {errline}\nWhat does it tell you about the cause?","check_fail":"The trial is not accomplished yet:\n  {output}\nCompare what is expected with the real state — what does `ls` show in the relevant place?","check_pass":"🎉 Trial accomplished, adventurer! {idiom}","idle":"Still there, adventurer? If you are stuck, type `gm` and tell me what you are trying to achieve, or ask `gm indice`.","run_and_see":"I won't tell you: run the command and observe the real output — the shell is the source of truth. Then tell me what you see.","chat_redirect":"Good question. Before I answer: what does the shell's last message say? Describe it to me.","hint_capped":"Try a little more on your own — I will step up the help if you are genuinely stuck (or after a few attempts)."}}};

const REPO = "";   /* set by build.py from $DEMO_REPO_URL */

/* ---------- state ---------- */
let lang="fr", mi=0, cwd=[], prev=null, missionCmds=[], fails=0, level=1,
    finished=false, hist=[], hpos=0, queue=[], timer=null;

const term=document.getElementById("term"), input=document.getElementById("in"),
      ps1=document.getElementById("ps1"), wrap=document.getElementById("wrap");

const M = ()=>DATA.missions[mi];
const T = ()=>DATA.t[lang];
const U = ()=>UI[lang];

/* ---------- world ---------- */
function nodeAt(path){
  let lvl=DATA.world, node=null;
  for(const key of path){ node=lvl[key]; if(!node) return null; lvl=node.children; }
  return path.length? node : {children:DATA.world};
}
function childrenAt(path){ const n=nodeAt(path); return n? (n.children||{}) : {}; }
function disp(key,node){ return lang==="fr" ? (node.fr||key) : key; }
function dispPath(path){
  let out=[], lvl=DATA.world;
  for(const key of path){ const n=lvl[key]; if(!n) break; out.push(disp(key,n)); lvl=n.children; }
  return out;
}
function pwdStr(path){ const d=dispPath(path); return d.length? "~/"+d.join("/") : "~"; }

/* resolve an argument to a path array, or {err} */
function resolve(arg){
  if(arg==="-"){ if(prev===null) return {err:U().noprev}; return {path:prev.slice(),show:true}; }
  let path, rest;
  if(arg===""||arg===undefined||arg==="~"){ return {path:[]}; }
  if(arg==="~/"||arg.startsWith("~/")){ path=[]; rest=arg.slice(2); }
  else if(arg.startsWith("/")){ path=[]; rest=arg.slice(1); }
  else { path=cwd.slice(); rest=arg; }
  for(const seg of rest.split("/")){
    if(seg===""||seg===".") continue;
    if(seg===".."){ path.pop(); continue; }
    const kids=childrenAt(path);
    const key=Object.keys(kids).find(k=>disp(k,kids[k])===seg);
    if(!key) return {err:null, missing:seg};
    path.push(key);
  }
  return {path};
}

/* ---------- output ---------- */
function line(text,cls){
  const el=document.createElement("span");
  el.className="l "+(cls||""); el.textContent=text===""?" ":text;
  term.appendChild(el); return el;
}
function scroll(){ wrap.scrollTop=wrap.scrollHeight; }

/* the Game Master speaks line by line; click anywhere to flush */
function say(text,head){
  const lines=String(text).replace(/\x06/g,"").split("\n");
  if(head!==false) queue.push({t:head||("🧙 "+(lang==="fr"?"Le Maitre du Jeu":"The Game Master")),c:"gmhead"});
  for(const l of lines) queue.push({t:l?"   "+l:"",c:"gm"});
  queue.push({t:"",c:""});
  pump();
}
function pump(){
  if(timer!==null) return;          // an id of 0 is legal, so test for null
  timer=setInterval(()=>{
    const it=queue.shift();
    if(!it){ clearInterval(timer); timer=null; input.focus(); return; }
    line(it.t,it.c); scroll();
  },28);
}
function flush(){                    // always drains, timer running or not
  if(timer!==null){ clearInterval(timer); timer=null; }
  let it; while((it=queue.shift())) line(it.t,it.c);
  scroll(); input.focus();
}
document.addEventListener("click",e=>{ if(e.target.tagName!=="BUTTON") flush(); });

/* ---------- tutor ---------- */
function fill(tpl,vars){
  return String(tpl).replace(/\{(\w+)\}/g,(m,k)=> (k in vars)? vars[k] : m);
}
function hintsFor(){ const h=M().hints; return h[lang]||h.en||[]; }

function briefing(){
  const m=M();
  const parts=[T().brief_intro,"",m.goal[lang],"",(m.intent[lang]||""),"",T().brief_outro];
  say(DATA.art+"\n\n"+parts.join("\n"));
}
function unlock(){
  fails++;
  if(fails>=6) level=4; else if(fails>=4) level=3; else if(fails>=2) level=2;
}
function askHint(){
  const h=hintsFor(); if(!h.length) return say(T().chat_redirect);
  say(h[Math.min(Math.max(level-2,0),h.length-1)]);
}
function chat(msg){
  const q=msg.toLowerCase();
  if(/what does|que fait|qu'est-ce que|c'est quoi|affiche|output/.test(q)) return say(T().run_and_see);
  const h=hintsFor();
  if(level>=2 && h.length>=level-1) return say(h[level-2]);
  say(T().chat_redirect);
}

/* ---------- mission check (the engine's real predicates) ---------- */
function passes(){
  const m=M();
  if(dispPath(cwd).join("/")!==dispPath(m.target).join("/")) return false;
  if(m.rule==="pwd+history"){
    const c=missionCmds.filter(x=>x.trim()!=="");
    if(c.length<2) return false;
    const prevCmd=c[c.length-2].trim();
    if(!/^cd(\s+~)?$/.test(prevCmd)) return false;
    if(!/^cd\s+\S/.test(c[c.length-1].trim())) return false;
  }
  return true;
}
function afterCommand(){
  if(finished||!passes()) return;
  const m=M();
  let idiom="";
  const rev=m.idiom&&m.idiom[lang];
  if(rev && (!m.idiom_trigger || missionCmds.join(" ; ").includes(m.idiom_trigger))) idiom=rev;
  say(fill(T().check_pass,{idiom}).trim());
  if(mi+1>=DATA.missions.length){ finished=true; setTimeout(endPanel,300); return; }
  mi++; level=1; fails=0; missionCmds=[];
  cwd=M().start.slice(); prev=null;
  setTimeout(()=>{ briefing(); setPs1(); },200);
}

/* ---------- commands ---------- */
function runGm(args){
  const sub=(args[0]||"").toLowerCase();
  if(!args.length) return say(T().chat_redirect);
  if(["indice","hint"].includes(sub)) return askHint();
  if(["mission","goal","epreuve","but"].includes(sub)) return briefing();
  if(["commandes","commands","aide"].includes(sub)) return say(U().help.join("\n"));
  if(["fini","valide","check"].includes(sub)){
    // the briefing renames the engine's `gsh check` to this, so it has to
    // work: checks are automatic in the demo, this just reports the verdict
    if(passes()) return afterCommand();
    const why=lang==="fr"?"Tu n'y es pas encore.":"Not there yet.";
    return say(fill(T().check_fail,{output:why}));
  }
  if(sub==="reset"){ cwd=M().start.slice(); prev=null; missionCmds=[]; setPs1();
                     return briefing(); }
  chat(args.join(" "));
}
function run(raw){
  const cmdline=raw.trim();
  if(cmdline==="") return;
  const parts=cmdline.split(/\s+/), c=parts[0], args=parts.slice(1);
  if(c==="clear"){ term.innerHTML=""; return; }
  if(c==="gm"||c==="maitre"){ runGm(args); return; }

  missionCmds.push(cmdline);
  if(c==="pwd"){ line(pwdStr(cwd)); return afterCommand(); }
  if(c==="ls"){
    const kids=childrenAt(cwd);
    const names=Object.keys(kids).map(k=>disp(k,kids[k])).sort();
    if(names.length) line(names.join("  "));
    return afterCommand();
  }
  if(c==="cd"){
    const r=resolve(args[0]===undefined?"":args[0]);
    if(r.err){ line(r.err,"err"); return; }
    if(r.missing){
      const msg=U().nofile("cd",args[0]);
      line(msg,"err"); unlock();
      say(fill(T().err_no_such_file,{errline:msg,cwd:pwdStr(cwd)}));
      return;
    }
    prev=cwd.slice(); cwd=r.path;
    if(r.show) line(pwdStr(cwd));
    setPs1();
    return afterCommand();
  }
  const msg=U().nocmd(c);
  line(msg,"err"); unlock();
  say(fill(T().err_not_found,{errline:msg,cwd:pwdStr(cwd)}));
}

/* ---------- chrome ---------- */
function setPs1(){ ps1.textContent=`[${lang==="fr"?"epreuve":"mission"} ${mi+1}] $`; }
function endPanel(){
  const d=document.createElement("div"); d.id="done";
  const u=U();
  d.innerHTML=`<h2>${u.done[0]}</h2>`+u.done.slice(1).map(p=>`<p>${p}</p>`).join("")+
    (REPO?`<p><a href="${REPO}" target="_blank" rel="noopener">${u.full} \u2192</a></p>`:"");
  term.appendChild(d); scroll();
}
function boot(reset){
  term.innerHTML=""; queue=[]; if(timer){clearInterval(timer);timer=null;}
  mi=0; level=1; fails=0; missionCmds=[]; finished=false; prev=null;
  cwd=M().start.slice();
  document.getElementById("tag").textContent=U().tag;
  document.getElementById("rst").textContent=U().reset;
  document.getElementById("foot").textContent=U().note;
  setPs1();
  line(U().boot,"dim"); line("");
  briefing();
}
for(const l of ["fr","en"]) document.getElementById(l).onclick=()=>{
  lang=l;
  document.getElementById("fr").setAttribute("aria-pressed",l==="fr");
  document.getElementById("en").setAttribute("aria-pressed",l==="en");
  document.documentElement.lang=l;
  boot();
};
document.getElementById("rst").onclick=()=>boot();

input.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    const v=input.value; input.value="";
    flush();
    const el=line("","cmd");
    const p=document.createElement("span"); p.className="p"; p.textContent=ps1.textContent+" ";
    el.appendChild(p); el.appendChild(document.createTextNode(v));
    if(v.trim()){ hist.push(v); hpos=hist.length; }
    run(v); scroll();
  } else if(e.key==="ArrowUp"){
    if(hpos>0){ hpos--; input.value=hist[hpos]||""; }
    e.preventDefault();
  } else if(e.key==="ArrowDown"){
    if(hpos<hist.length){ hpos++; input.value=hist[hpos]||""; }
    e.preventDefault();
  } else if(e.key==="Tab"){
    e.preventDefault();
    const parts=input.value.split(/\s+/), last=parts[parts.length-1]||"";
    const seg=last.split("/"); const stem=seg.pop();
    const base=seg.length? resolve(seg.join("/")) : {path:cwd.slice()};
    if(base.missing||base.err) return;
    const kids=childrenAt(base.path);
    const hits=Object.keys(kids).map(k=>disp(k,kids[k])).filter(n=>n.startsWith(stem));
    if(hits.length===1){
      seg.push(hits[0]); parts[parts.length-1]=seg.join("/")+"/";
      input.value=parts.join(" ");
    } else if(hits.length>1){ flush(); line(hits.join("  "),"dim"); scroll(); }
  }
});
boot();
</script>
