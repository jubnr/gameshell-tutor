# igpu.conf — offload the tutor model to an integrated GPU. GPLv3.
#
# Install:  sudo bash ollama/enable-igpu.sh [vulkan|rocm [GFXVER]]
#           (that script writes this file, restarts Ollama, benchmarks the
#            result and reverts itself if the model cannot answer)
# Verify:   curl -s localhost:11434/api/ps | grep -o '"size_vram":[0-9]*'
#           (non-zero = the model really sits on the GPU)
# Revert:   sudo rm /etc/systemd/system/ollama.service.d/igpu.conf
#           sudo systemctl daemon-reload && sudo systemctl restart ollama
#
# Why both variables:
#
# OLLAMA_IGPU_ENABLE=1 — Ollama skips integrated GPUs by default (they share
# system RAM, so they are often no faster than the CPU). This opts back in.
#
# HSA_OVERRIDE_GFX_VERSION — ROCm only loads kernels for GPU targets it was
# built for. Check yours with:
#     grep gfx_target_version /sys/class/kfd/kfd/topology/nodes/*/properties
# 110003 = gfx1103 (Radeon 780M/760M, Ryzen 7040/8040 "Phoenix"), which ROCm
# does not support officially; 11.0.2 makes it load the gfx1102 kernels, which
# are compatible in practice. Other common values: gfx1035/1036 (RDNA2 iGPU)
# -> 10.3.0, gfx1150/1151 ("Strix") -> 11.5.1 or 11.0.2. Wrong value = the
# server falls back to CPU or crashes on load; both are undone by "Revert".
#
# If ROCm will not engage, comment the two lines below and use the Vulkan
# backend instead (Ollama ships it; needs a Vulkan driver such as Mesa RADV):
#     Environment="OLLAMA_VULKAN=1"
# Vulkan is usually the more forgiving path on iGPUs and needs no override.
#
# Memory: the iGPU carves its buffers out of system RAM through GTT, so keep
# enough free for the model (~5.5 GB for shell-tutor 7B q4_K_M).

[Service]
Environment="OLLAMA_IGPU_ENABLE=1"
Environment="HSA_OVERRIDE_GFX_VERSION=11.0.2"
